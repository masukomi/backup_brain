tools:
  - name: reader
    default: true
    command: "bin/reader -o --image-mode none {TEMPFILE}"
  - name: soundgasm
    domains:
      - soundgasm.net
    command: "bundle exec bin/soundgasm_archiver {TEMPFILE}"
  # Add per-domain tools below. The first tool whose domains list matches
  # the URL's hostname is used; if none match, the default tool is used.
  # Subdomain matching is automatic: "youtube.com" also matches "www.youtube.com".
  # Available placeholders: {TEMPFILE} (path to downloaded HTML), {URL} (original URL)
  #
  # NOTE: all archiving tools are expected to return a markdown version of the HTML
  # that is contained in TEMPFILE
  #
  # - name: my_tool
  #   domains:
  #     - example.com
  #     - example.net
  #   command: "bin/my_tool {TEMPFILE}"
