headers:
  - name: default
    default: true
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:149.0) Gecko/20100101 Firefox/149.0"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "en-US,en;q=0.5"
      DNT: "1"
      Sec-GPC: "1"
      Connection: "keep-alive"
      Upgrade-Insecure-Requests: "1"
      Sec-Fetch-Dest: "document"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-Site: "none"
      Sec-Fetch-User: "?1"
      Priority: "u=0, i"

  # Per-domain header overrides. These are merged on top of the default headers,
  # so you only need to specify what differs from the defaults.
  # Subdomain matching is automatic: "example.com" also matches "www.example.com".
  # ⚠️ DO NOT SET Accept-Encoding
  # If you manually set Accept-Encoding in the request headers, Net::HTTP
  # sees that you've taken ownership of encoding negotiation and disables
  # its automatic decompression. The response body comes back as raw compressed bytes.
  # which backup_brain doesn't have built-in support for.
  #
  # - name: example
  #   domains:
  #     - example.com
  #   headers:
  #     Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
  #     Referer: "https://example.com/"
