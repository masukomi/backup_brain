change-type:
    destination: title
    type: select
    modifiable: true
    instructions: What kind of change?
    before-string: '['
    after-string: ']'
    format: "%-12s"
    options:
        - fix
        - add
        - refactor
        - clean-up
breaking-indicator:
    destination: title
    type: select
    after-string: ': '
    allow-empty: true
    empty-selection-text: Skip
    instructions: Skip unless breaking change
    options:
        - ⚠️
commit-title:
    destination: title
    type: text
    placeholder: Commit Title
commit-description:
    destination: body
    type: multiline-text
    allow-empty: true
    instructions: Please describe your changes.
code-sections:
    destination: body
    type: multi-select
    allow-empty: true
    modifiable: true
    record-as: joined-string
    before-string: "\nCode Sections: "
    instructions: Which section(s) of the codebase?
    options:
        - bookmarks
        - archives
        - ui
        - ux
        - css
        - config
        - meta
        - tests
        - migrations
        - infrastructure
        - tags
        - oauth
ticket-number:
    destination: body
    type: text
    allow-empty: true
    before-string: "\n\nTicket: "
    data-type: integer
    instructions: Associated Ticket Number (if any)
meta_element_changelog:
    display_aliases:
        fix: "fixed"
        add: "added"
        refactor: "refactored"
        clean-up: "cleaned"
